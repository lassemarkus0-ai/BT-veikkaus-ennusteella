<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BT-VEIKKAUS 2026 · Sarjataulukko</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <h1>BT-VEIKKAUS <span>2026</span></h1>
  <nav class="top-nav">
    <a href="index.html" class="active">Sarjataulukko</a>
    <a href="ottelut.html">Ottelut</a>
    <a href="muut.html">Muut veikkaukset</a>
  </nav>
</header>

<main class="container">

  <section class="panel">
    <h2>Sarjataulukko</h2>
    <div id="leaderboard-body"></div>
  </section>

</main>

<script>
fetch('data.json')
  .then(r => r.json())
  .then(data => {
    const scores = {};
    data.players.forEach(p => scores[p] = 0);

    data.matches.forEach(m => {
      if (["1","X","2"].includes(m.result)) {
        Object.entries(m.predictions).forEach(([player, pred]) => {
          if (pred === m.result) scores[player]++;
        });
      }
    });

    const sorted = Object.entries(scores).sort((a,b)=>b[1]-a[1]);
    const out = sorted.map(([name, pts], i)=>`
      <div class="leaderboard-row">
        <span>#${i+1}</span>
        <span>${name}</span>
        <span>${pts} p</span>
      </div>
    `).join('');

    document.getElementById('leaderboard-body').innerHTML = out;
  });
</script>

</body>
</html>
