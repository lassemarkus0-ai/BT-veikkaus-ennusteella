<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BT-VEIKKAUS 2026</title>
    <style>
        :root {
            --bg-color: #0b1320;
            --card-bg: #111a2e;
            --border-color: #1e2d4a;
            --accent-gold: #f59e0b;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --badge-played: #059669;
            --badge-upcoming: #2563eb;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px 15px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 32px;
            margin: 0;
            letter-spacing: 2px;
            color: #ffffff;
        }

        .header h1 span {
            color: var(--accent-gold);
        }

        .header p {
            margin: 6px 0 0 0;
            color: var(--text-muted);
            font-size: 14px;
        }

        /* Tilastokortit */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 25px;
        }

        .stat-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 16px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #ffffff;
        }

        .stat-label {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Välilehdet */
        .tabs {
            display: flex;
            justify-content: center;
            gap: 20px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        .tab-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 15px;
            font-weight: 600;
            padding: 10px 15px;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }

        .tab-btn:hover {
            color: var(--text-main);
        }

        .tab-btn.active {
            color: var(--accent-gold);
            border-bottom-color: var(--accent-gold);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Sarjataulukko */
        .standings-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .standing-row {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 14px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .standing-player {
            font-weight: 600;
            font-size: 16px;
        }

        .standing-points {
            color: var(--accent-gold);
            font-weight: bold;
            font-size: 16px;
        }

        /* Ottelu- ja Muut veikkaukset -taulukot */
        .table-wrapper {
            overflow-x: auto;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
        }

        .matches-table, .other-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 14px;
        }

        .matches-table th, .matches-table td,
        .other-table th, .other-table td {
            padding: 12px 15px;
            border-bottom: 1px solid var(--border-color);
        }

        .matches-table th, .other-table th {
            background-color: rgba(255, 255, 255, 0.03);
            color: var(--text-muted);
            font-weight: 600;
            white-space: nowrap;
        }

        .other-table td:first-child {
            font-weight: 600;
            color: var(--accent-gold);
            min-width: 220px;
        }

        .col-date {
            white-space: nowrap;
            color: var(--text-muted);
        }

        .col-match {
            font-weight: bold;
            white-space: nowrap;
        }

        .badge {
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 4px;
            text-transform: uppercase;
            font-weight: bold;
            display: inline-block;
        }

        .badge-played { background-color: rgba(5, 150, 105, 0.2); color: #34d399; }
        .badge-upcoming { background-color: rgba(37, 99, 235, 0.2); color: #60a5fa; }

        .table-predictions {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .pred-tag {
            background-color: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-color);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 12px;
        }

        .pred-tag.correct {
            border-color: var(--accent-gold);
            background-color: rgba(245, 158, 11, 0.15);
            color: var(--accent-gold);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>BT-VEIKKAUS <span>2026</span></h1>
            <p>Kärppäpainotteinen BT-kisa</p>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value" id="stat-players">0</div>
                <div class="stat-label">Pelaajaa</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="stat-matches">0 / 0</div>
                <div class="stat-label">Ottelua pelattu</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="stat-top-points">0.0 p</div>
                <div class="stat-label">Kärkipistettä</div>
            </div>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('standings')">Sarjataulukko</button>
            <button class="tab-btn" onclick="switchTab('matches')">Ottelut</button>
            <button class="tab-btn" onclick="switchTab('other')">Muut veikkaukset</button>
        </div>

        <div id="tab-standings" class="tab-content active">
            <div id="standings-container" class="standings-list">Ladataan...</div>
        </div>

        <div id="tab-matches" class="tab-content">
            <div id="matches-container">Ladataan...</div>
        </div>

        <div id="tab-other" class="tab-content">
            <div id="other-container">Ladataan...</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
