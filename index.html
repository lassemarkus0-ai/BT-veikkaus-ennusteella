<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BT-VEIKKAUS 2026</title>
    <style>
        body {
            background: #111;
            color: #eee;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        header {
            text-align: center;
            padding: 20px;
        }
        .stats-grid {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px;
        }
        .stat-card {
            background: #222;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
        .leaderboard-list {
            margin: 20px;
        }
    </style>
</head>
<body>

    <header>
        <h1>BT-VEIKKAUS <span>2026</span></h1>
        <p class="subtitle">Kärppäpainotteinen BT-kisa</p>
    </header>

    <main class="container">

        <div class="stats-grid">
            <div class="stat-card">
                <span class="stat-value" id="player-count">0</span>
                <span class="stat-label">Pelaajaa</span>
            </div>
            <div class="stat-card">
                <span class="stat-value" id="played-count">0 / 0</span>
                <span class="stat-label">Ottelua pelattu</span>
            </div>
            <div class="stat-card">
                <span class="stat-value" id="top-points">0.0 p</span>
                <span class="stat-label">Kärkipistettä</span>
            </div>
        </div>

        <h2>Sarjataulukko</h2>
        <div id="leaderboard-body"></div>

    </main>

    <!-- build trigger -->
    <script src="script.js"></script>
</body>
</html>
