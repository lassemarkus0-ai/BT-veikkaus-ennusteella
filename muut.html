<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BT-VEIKKAUS 2026 · Muut veikkaukset</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <h1>BT-VEIKKAUS <span>2026</span></h1>
  <nav class="top-nav">
    <a href="index.html">Sarjataulukko</a>
    <a href="ottelut.html">Ottelut</a>
    <a href="muut.html" class="active">Muut veikkaukset</a>
  </nav>
</header>

<main class="container">

  <section class="panel">
    <h2>Muut veikkaukset</h2>
    <table id="pred-table" class="predictions-table"></table>
  </section>

</main>

<script>
fetch('data.json')
  .then(r => r.json())
  .then(data => {
    const preds = data.other_predictions;
    const players = Object.keys(preds[0].predictions);

    let html = `<tr><th>Kohde</th>${players.map(p=>`<th>${p}</th>`).join('')}</tr>`;

    preds.forEach(item => {
      html += `<tr><td>${item.question}</td>` +
        players.map(p => `<td>${item.predictions[p]}</td>`).join('') +
        `</tr>`;
    });

    document.getElementById('pred-table').innerHTML = html;
  });
</script>

</body>
</html>
