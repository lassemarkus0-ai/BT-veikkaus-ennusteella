<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BT-VEIKKAUS 2026 · Ottelut</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <h1>BT-VEIKKAUS <span>2026</span></h1>
  <nav class="top-nav">
    <a href="index.html">Sarjataulukko</a>
    <a href="ottelut.html" class="active">Ottelut</a>
    <a href="muut.html">Muut veikkaukset</a>
  </nav>
</header>

<main class="container">

  <section class="panel">
    <h2>Kärppien ottelut</h2>
    <div id="matches-list"></div>
  </section>

</main>

<script>
fetch('data.json')
  .then(r => r.json())
  .then(data => {
    const out = data.matches.map(m => `
      <div class="match-row">
        <div>
          <strong>${m.date}</strong><br>
          ${m.homeTeam} – ${m.awayTeam}
        </div>
        <div class="match-result">${m.result || "–"}</div>
      </div>
    `).join('');

    document.getElementById('matches-list').innerHTML = out;
  });
</script>

</body>
</html>
